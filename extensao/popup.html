<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Meu bloco de anotações</title>
    <style>
      body {
        margin: 0;
        width: 300px;
        font: 13px/1.4 -apple-system, system-ui, sans-serif;
        background: #151d2b;
        color: #e9eef6;
      }
      .abas {
        display: flex;
        gap: 4px;
        padding: 12px 16px 0;
      }
      .aba {
        flex: 1;
        font: inherit;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        padding: 7px 0;
        cursor: pointer;
        background: transparent;
        color: #9fadc0;
      }
      .aba.ativa {
        background: #1b2434;
        color: #e9eef6;
      }
      .painel {
        display: none;
      }
      .painel.ativo {
        display: block;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 16px 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #1b2434;
      }
      .bolinha {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .bolinha.aberto {
        background: #0ea47c;
      }
      .bolinha.trancado {
        background: #7a8ba1;
      }
      .bolinha.offline {
        background: #ff6369;
      }
      button.acao {
        display: block;
        width: calc(100% - 32px);
        margin: 0 16px 14px;
        font: inherit;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        padding: 9px;
        cursor: pointer;
        background: #0ea47c;
        color: #fff;
      }
      .rodape {
        padding: 0 16px 14px;
        color: #7a8ba1;
        font-size: 11px;
      }
      .rodape a {
        color: #7a8ba1;
      }
      #quadroLinks,
      #quadroCompras {
        display: block;
        width: 100%;
        height: 420px;
        border: 0;
      }
      #quadroCompras {
        height: 560px;
      }
      #linksCarregando,
      #comprasCarregando {
        padding: 24px 16px;
        text-align: center;
        color: #7a8ba1;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="abas">
      <button type="button" class="aba ativa" id="abaSenhas">🔑 Senhas</button>
      <button type="button" class="aba" id="abaLinks">🔖 Links</button>
      <button type="button" class="aba" id="abaCompras">🛒 Compras</button>
    </div>

    <div class="painel ativo" id="painelSenhas">
      <div class="status" id="status">
        <span class="bolinha" id="bolinha"></span>
        <span id="texto">Verificando…</span>
      </div>
      <button type="button" class="acao" id="abrir">Abrir o cofre</button>
      <p class="rodape">Preenche e captura senhas em qualquer site — <a href="opcoes.html" target="_blank">preferências</a>.</p>
    </div>

    <div class="painel" id="painelLinks">
      <p id="linksCarregando">Carregando…</p>
      <iframe id="quadroLinks" title="Seus links" hidden></iframe>
      <p class="rodape">Painel maior e mais confortável: clique com o botão direito no ícone da extensão → <strong>Abrir painel lateral</strong>.</p>
    </div>

    <div class="painel" id="painelCompras">
      <p id="comprasCarregando">Carregando…</p>
      <iframe id="quadroCompras" title="Salvar produto" hidden></iframe>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
